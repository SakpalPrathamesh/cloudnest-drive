<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CloudNest Drive – Sign In</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="page">

    <!-- Brand -->
    <div class="brand">
      ☁️ <span>CloudNest Drive</span>
    </div>

    <!-- Card -->
    <div class="card">

      <!-- Tab buttons -->
      <div class="tabs">
        <button class="tab active" id="tab-login"
          onclick="switchTab('login')">Sign In</button>
        <button class="tab" id="tab-signup"
          onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Error message box -->
      <div class="alert error" id="error-box" style="display:none">
        <span id="error-text"></span>
      </div>

      <!-- Success message box -->
      <div class="alert success" id="success-box" style="display:none">
        <span id="success-text"></span>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">

        <div class="field">
          <label>Email address</label>
          <input type="email" id="login-email"
            placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password"
            placeholder="Your password" required />
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          Sign In
        </button>

      </form>

      <!-- SIGNUP FORM (hidden by default) -->
      <form id="signup-form" style="display:none"
        onsubmit="handleSignup(event)">

        <div class="field">
          <label>Full name</label>
          <input type="text" id="signup-name"
            placeholder="John Doe" required />
        </div>

        <div class="field">
          <label>Email address</label>
          <input type="email" id="signup-email"
            placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-password"
            placeholder="At least 6 characters" required />
        </div>

        <button type="submit" class="btn-primary" id="signup-btn">
          Create Account
        </button>

      </form>

    </div><!-- end card -->

  </div><!-- end page -->

  <!-- Firebase SDK (loads from Google's CDN — no install needed) -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword,
      createUserWithEmailAndPassword, updateProfile }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { FIREBASE_CONFIG, API_BASE_URL } from "./js/config.js";

    // Initialize Firebase
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    // Make these available to auth.js
    window._auth          = auth;
    window._signIn        = signInWithEmailAndPassword;
    window._createUser    = createUserWithEmailAndPassword;
    window._updateProfile = updateProfile;
    window._apiBase       = API_BASE_URL;
  </script>

  <script src="js/auth.js"></script>

</body>
</html>
