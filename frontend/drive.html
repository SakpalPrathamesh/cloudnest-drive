<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CloudNest Drive – My Drive</title>
  <link rel="stylesheet" href="css/drive.css"/>
</head>
<body>

  <!-- ── TOP BAR ── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">☁️ CloudNest Drive</span>
    </div>
    <div class="topbar-center">
      <input type="text" class="search-box"
        placeholder="Search files…"
        id="search-input"
        oninput="filterFiles(this.value)" />
    </div>
    <div class="topbar-right">
      <span class="user-name" id="user-name">…</span>
      <button class="btn-logout" onclick="handleLogout()">
        Sign Out
      </button>
    </div>
  </header>

  <!-- ── LAYOUT ── -->
  <div class="layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <button class="upload-btn"
        onclick="document.getElementById('file-input').click()">
        ⬆ Upload File
      </button>
      <input type="file" id="file-input" style="display:none"
        multiple onchange="handleFileSelect(event)" />

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">📁 My Drive</a>
      </nav>
    </aside>

    <!-- ── MAIN AREA ── -->
    <main class="main">

      <!-- Upload progress bar (hidden until uploading) -->
      <div id="upload-box" style="display:none" class="upload-box">
        <span id="upload-status">Uploading…</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Section title -->
      <h2 class="section-title">My Drive</h2>

      <!-- Loading spinner -->
      <div id="loading" class="loading-text">Loading your files…</div>

      <!-- Error state -->
      <div id="error-state" style="display:none" class="empty-state">
        <p>😕 Could not load files.</p>
        <button class="btn-retry" onclick="loadFiles()">Try again</button>
      </div>

      <!-- Empty state -->
      <div id="empty-state" style="display:none" class="empty-state">
        <p>☁️ Your drive is empty.</p>
        <p>Click <strong>Upload File</strong> to add your first file!</p>
      </div>

      <!-- File grid -->
      <div id="files-grid" class="files-grid" style="display:none">
      </div>

    </main>

  </div><!-- end layout -->

  <!-- ── DELETE CONFIRMATION POPUP ── -->
  <div id="delete-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>Delete file?</h3>
      <p>Are you sure you want to delete
        <strong id="delete-name"></strong>?
      </p>
      <div class="modal-btns">
        <button class="btn-cancel"
          onclick="closeModal()">Cancel</button>
        <button class="btn-delete"
          id="confirm-delete-btn"
          onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { FIREBASE_CONFIG, API_BASE_URL } from "./js/config.js";

    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    window._auth    = auth;
    window._signOut = signOut;
    window._apiBase = API_BASE_URL;

    // Guard: if not logged in, send back to login page
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      // Refresh token and initialize drive
      window._idToken = await user.getIdToken(true);
      window._currentUser = user;
      initDrive(user);
    });
  </script>

  <script src="js/drive.js"></script>

</body>
</html>
